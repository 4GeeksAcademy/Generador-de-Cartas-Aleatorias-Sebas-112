<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Generador de Cartas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-dark">
  <main class="stage">
    <header class="title">
      <h1>Generador de Cartas <span>pro</span></h1>
      <div class="toggles">
        <label class="switch">
          <input id="themeToggle" type="checkbox" />
          <span>Modo claro</span>
        </label>
      </div>
    </header>

    <section class="table" id="table">
      <div class="card-wrap" id="cardWrap" aria-live="polite">
        <div id="card" class="card playing">
          <div class="top-suit position-absolute"></div>
          <div class="number"></div>
          <div class="bottom-suit position-absolute"></div>
        </div>
      </div>
      <p id="cardLabel" class="label" aria-live="polite">—</p>
    </section>

    <footer class="controls">
      <div class="buttons">
        <button id="new-card" class="btn-cta">Nueva carta</button>
        <button id="autoToggle" class="btn">Auto</button>
      </div>
      <div class="auto">
        <label for="speed">Velocidad</label>
        <input id="speed" type="range" min="500" max="4000" step="250" value="1500" />
        <span id="speedVal">1.5s</span>
      </div>
      <small class="hint">Tip: también puedes presionar <kbd>Espacio</kbd> o <kbd>Enter</kbd></small>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
